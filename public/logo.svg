<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="brandBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="50%" stop-color="#0a1d1c" />
      <stop offset="100%" stop-color="#062822" />
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="brandEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#0ea879" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="brandAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="brandGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(10, 10) scale(0.273)">
    <!-- Base Squircle -->
    <rect width="512" height="512" rx="120" fill="url(#brandBgGrad)" stroke="#1e3a35" stroke-width="8" />
    <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="4" />

    <!-- Outer Routine Cadence Ring -->
    <circle cx="256" cy="256" r="184" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="18" />
    <path d="M 256 72 A 184 184 0 1 1 104 152" fill="none" stroke="url(#brandEmeraldGrad)" stroke-width="22" stroke-linecap="round" />
    <circle cx="104" cy="152" r="14" fill="#34d399" />

    <!-- Central R Monogram -->
    <rect x="160" y="160" width="46" height="192" rx="20" fill="url(#brandEmeraldGrad)" />
    <path d="M 186 160 H 280 C 330 160 360 185 360 225 C 360 265 330 290 280 290 H 186 Z" 
          fill="none" 
          stroke="url(#brandEmeraldGrad)" 
          stroke-width="42" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M 264 274 L 344 352" stroke="url(#brandAccentGrad)" stroke-width="44" stroke-linecap="round" />

    <!-- Apex Gold Star -->
    <polygon points="256,44 266,66 288,76 266,86 256,108 246,86 224,76 246,66" fill="url(#brandGoldGrad)" />
  </g>

  <!-- Typography Right Group -->
  <g transform="translate(170, 0)">
    <!-- Brand Acronym RGR -->
    <text x="0" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="58" letter-spacing="1.5" fill="#ffffff">
      RGR
    </text>

    <!-- Subtitle Capsule Badge -->
    <g transform="translate(150, 42)">
      <rect x="0" y="0" width="168" height="28" rx="8" fill="rgba(14, 168, 121, 0.15)" stroke="rgba(14, 168, 121, 0.4)" stroke-width="1.5" />
      <text x="84" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="1.8" fill="#34d399">
        GOVERNANÇA
      </text>
    </g>

    <!-- Primary Sub-label -->
    <text x="0" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="19" letter-spacing="1.2" fill="#e2e8f0">
      GERENCIAMENTO DA ROTINA
    </text>

    <!-- Secondary Tagline -->
    <text x="0" y="134" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" letter-spacing="2.2" fill="#94a3b8">
      FACILITIES &amp; CORPORATE OPERATIONS
    </text>
  </g>
</svg>
